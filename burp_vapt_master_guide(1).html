<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burp Suite VAPT Master Guide</title>
<style>
:root{--bg:#0a0e17;--bg2:#111827;--bg3:#1a2233;--card:#141c2b;--border:#26304a;--txt:#e6edf5;--txt2:#9aa8bf;--acc:#ff6633;--acc2:#4da3ff;--ok:#3ecf8e;--warn:#f5b942;--crit:#ff4757;--high:#ff7043;--med:#f5b942;--low:#4da3ff;--info:#8a93a6;--mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
[data-theme="light"]{--bg:#f4f6fb;--bg2:#fff;--bg3:#eef1f7;--card:#fff;--border:#d9dfea;--txt:#1a2233;--txt2:#5a6579;--acc:#e65a2b;--acc2:#2563eb;--info:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.6}
a{color:var(--acc2);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:270px 1fr;height:100vh;overflow:hidden}
/* Sidebar */
.side{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.brand svg{flex:0 0 auto}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.2px}
.brand span{color:var(--txt2);font-size:11px;display:block;font-weight:400}
.navwrap{overflow-y:auto;flex:1;padding:8px 0 40px}
.navgroup{margin:2px 0}
.navgroup>.gt{padding:10px 18px 4px;font-size:10px;letter-spacing:1.2px;color:var(--txt2);text-transform:uppercase;font-weight:700}
.navitem{display:flex;align-items:center;gap:8px;padding:7px 18px 7px 22px;cursor:pointer;color:var(--txt2);font-size:13px;border-left:2px solid transparent}
.navitem:hover{background:var(--bg3);color:var(--txt)}
.navitem.active{color:var(--txt);border-left-color:var(--acc);background:var(--bg3)}
.navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);opacity:0;flex:0 0 auto}
.navitem.done .dot{opacity:1}
/* Main */
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg2)}
.search{flex:1;position:relative;max-width:560px}
.search input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:9px 12px 9px 34px;border-radius:8px;font-size:13px;outline:none}
.search input:focus{border-color:var(--acc2)}
.search .ic{position:absolute;left:10px;top:9px;color:var(--txt2)}
.sresults{position:absolute;top:42px;left:0;right:0;background:var(--bg2);border:1px solid var(--border);border-radius:8px;max-height:60vh;overflow-y:auto;z-index:50;box-shadow:0 12px 40px rgba(0,0,0,.4);display:none}
.sresults.show{display:block}
.sres{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.sres:hover{background:var(--bg3)}
.sres .cat{font-size:10px;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
.sres .nm{font-weight:600;font-size:13px}
.sres .ds{font-size:12px;color:var(--txt2)}
.tbtn{background:var(--bg3);border:1px solid var(--border);color:var(--txt);width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tbtn:hover{border-color:var(--acc2)}
.content{overflow-y:auto;padding:26px 34px 80px;flex:1;scroll-behavior:smooth}
.wrap{max-width:1080px;margin:0 auto}
/* Typo */
h2.pt{font-size:26px;font-weight:800;margin-bottom:4px;letter-spacing:-.3px}
.crumb{color:var(--txt2);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
h3{font-size:17px;margin:22px 0 8px;color:var(--txt)}
h4{font-size:14px;margin:16px 0 6px;color:var(--acc2);text-transform:uppercase;letter-spacing:.5px}
p{margin:8px 0;color:var(--txt)}
ul,ol{margin:8px 0 8px 22px}li{margin:4px 0}
.muted{color:var(--txt2)}
.lead{font-size:15px;color:var(--txt2);margin-bottom:8px}
/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin:14px 0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat .n{font-size:28px;font-weight:800}
.stat .l{color:var(--txt2);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.bar{height:8px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
/* badges */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.b-crit{background:rgba(255,71,87,.16);color:var(--crit)}
.b-high{background:rgba(255,112,67,.16);color:var(--high)}
.b-med{background:rgba(245,185,66,.16);color:var(--med)}
.b-low{background:rgba(77,163,255,.16);color:var(--low)}
.b-info{background:rgba(138,147,166,.18);color:var(--info)}
.b-tool{background:rgba(77,163,255,.14);color:var(--acc2)}
.b-tag{background:var(--bg3);color:var(--txt2);border:1px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
/* code / http */
pre{background:#05070d;border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.7;position:relative;color:#cfe3ff}
[data-theme="light"] pre{background:#0d1220;color:#cfe3ff}
pre .k{color:#ff8f66}pre .h{color:#7fd0ff}pre .v{color:#8ce6b0}pre .c{color:#6b7688}
.copy{position:absolute;top:8px;right:8px;background:var(--bg3);border:1px solid var(--border);color:var(--txt2);font-size:10px;padding:3px 8px;border-radius:6px;cursor:pointer}
.copy:hover{color:var(--txt);border-color:var(--acc2)}
/* accordion */
.acc{border:1px solid var(--border);border-radius:10px;margin:10px 0;overflow:hidden;background:var(--card)}
.acc>.ah{padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.acc>.ah:hover{background:var(--bg3)}
.acc>.ah .ar{margin-left:auto;transition:transform .2s;color:var(--txt2)}
.acc.open>.ah .ar{transform:rotate(90deg)}
.acc>.ab{display:none;padding:4px 18px 16px;border-top:1px solid var(--border)}
.acc.open>.ab{display:block}
/* flow */
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:14px 0}
.flow .step{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--acc2);padding:11px 15px;border-radius:8px}
.flow .step b{color:var(--txt)}
.flow .arw{align-self:center;color:var(--acc);font-size:18px;line-height:1;padding:4px 0}
.flow.h{flex-direction:row;flex-wrap:wrap;align-items:center}
.flow.h .arw{padding:0 4px}
.flow.h .step{flex:1;min-width:120px}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:12px 0;display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--border);padding:9px 11px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg3);color:var(--txt2);text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;position:sticky;top:0}
.tbl tr:hover td{background:var(--bg3)}
/* buttons */
.btn{background:var(--acc);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--txt)}
.btn.ghost:hover{border-color:var(--acc2)}
.btn.sm{padding:5px 11px;font-size:12px}
.iconbtn{background:none;border:none;color:var(--txt2);cursor:pointer;padding:4px}
.iconbtn:hover{color:var(--acc)}
.iconbtn.on{color:var(--warn)}
/* checklist */
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border)}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
.chk label{cursor:pointer;flex:1}
.chk.checked label{color:var(--txt2);text-decoration:line-through}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.fchip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--txt2);cursor:pointer;font-size:12px}
.fchip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
/* notes */
textarea{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:10px;font-family:inherit;font-size:13px;resize:vertical;min-height:80px;outline:none}
textarea:focus{border-color:var(--acc2)}
input.fld,select.fld{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:9px 11px;font-size:13px;outline:none;font-family:inherit}
input.fld:focus,select.fld:focus{border-color:var(--acc2)}
.field{margin:10px 0}.field>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);margin-bottom:4px}
/* decision engine */
.deopt{display:inline-flex;padding:9px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;margin:5px}
.deopt:hover{border-color:var(--acc)}
.deopt.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.callout{border-left:3px solid var(--warn);background:rgba(245,185,66,.08);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.callout.ok{border-color:var(--ok);background:rgba(62,207,142,.08)}
.callout.crit{border-color:var(--crit);background:rgba(255,71,87,.08)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:2px 14px}
.kv .k{color:var(--txt2);font-size:12px;padding:5px 0}
.kv .v{padding:5px 0}
.hide{display:none!important}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.tools-inline{display:flex;gap:5px;flex-wrap:wrap}
.reqbuilder .row{display:grid;grid-template-columns:110px 1fr;gap:8px;margin:6px 0}
@media print{.side,.topbar{display:none}.app{display:block;height:auto}.content{overflow:visible;padding:0}.no-print{display:none!important}}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:100;width:270px;height:100%;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}.menu-toggle{display:flex!important}}
.menu-toggle{display:none}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-4z" fill="var(--acc)" opacity=".18"/><path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-4z" stroke="var(--acc)" stroke-width="1.4"/><circle cx="12" cy="10" r="2.4" stroke="var(--acc2)" stroke-width="1.4"/><path d="M12 12.4V16" stroke="var(--acc2)" stroke-width="1.4"/></svg>
      <div><h1>Burp VAPT Master<span>Field Manual &amp; Playbook</span></h1></div>
    </div>
    <div class="navwrap" id="nav"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="tbtn menu-toggle" onclick="document.getElementById('side').classList.toggle('open')" title="Menu">☰</button>
      <div class="search">
        <span class="ic">🔍</span>
        <input id="q" placeholder="Search tools, vulns, OWASP, CWE, headers, workflows…" autocomplete="off">
        <div class="sresults" id="sres"></div>
      </div>
      <button class="tbtn" id="theme" title="Toggle theme">◐</button>
      <button class="tbtn" onclick="go('bookmarks')" title="Bookmarks">★</button>
    </div>
    <div class="content" id="content"><div class="wrap" id="view"></div></div>
  </main>
</div>
<script>
/* ============ STORAGE (localStorage w/ in-memory fallback) ============ */
const Store=(()=>{let ok=false,mem={};try{localStorage.setItem('__t','1');localStorage.removeItem('__t');ok=true}catch(e){ok=false}
 const P='burpvapt.';
 return{get(k,d){try{if(ok){const v=localStorage.getItem(P+k);return v==null?d:JSON.parse(v)}return k in mem?mem[k]:d}catch(e){return d}},
 set(k,v){try{if(ok)localStorage.setItem(P+k,JSON.stringify(v));else mem[k]=v}catch(e){mem[k]=v}},
 persistent:ok}})();
let progress=Store.get('progress',{}),bookmarks=Store.get('bookmarks',[]),notes=Store.get('notes',{}),checks=Store.get('checks',{});
function saveProgress(){Store.set('progress',progress)}
function toggleDone(id){progress[id]=!progress[id];saveProgress();renderNav();if(current)go(current)}
function isBM(id){return bookmarks.includes(id)}
function toggleBM(id){bookmarks=isBM(id)?bookmarks.filter(x=>x!==id):[...bookmarks,id];Store.set('bookmarks',bookmarks);if(current)go(current)}
function setNote(id,v){notes[id]=v;Store.set('notes',notes)}
function toggleCheck(id){checks[id]=!checks[id];Store.set('checks',checks)}

/* ============ DATA ============ */
const SEV={crit:'Critical',high:'High',med:'Medium',low:'Low',info:'Informational'};
const sevBadge=s=>`<span class="badge b-${s}">${SEV[s]||s}</span>`;
const toolBadge=t=>`<span class="badge b-tool">${t}</span>`;

/* Foundation topics */
const FOUNDATION=[
 {id:'f-overview',t:'Burp Suite Overview',b:'What Burp is and the mindset it enables',body:()=>`
  <p class="lead">Burp Suite is an intercepting-proxy platform for testing web and API security. It sits between your browser (or API client) and the target, letting you observe, pause, modify, and replay every HTTP/S message.</p>
  <p>Burp is not a "scan and report" button. Its power is that it makes the raw conversation between client and server fully visible and editable, so a human can reason about <b>trust boundaries</b>: what the server assumes, and whether those assumptions can be broken.</p>
  <div class="callout"><b>Core idea used throughout this guide:</b> Baseline → Modify → Compare → Validate → Impact → Report. Burp is the instrument; your reasoning is the method.</div>
  <h4>Editions</h4>
  <ul><li><b>Community</b> — Proxy, Repeater, Decoder, Comparer; time-throttled Intruder; no automated scanner. Fine for learning manual testing.</li>
  <li><b>Professional</b> — full Intruder, Scanner, Collaborator, project files, saved state. The standard for professional VAPT.</li>
  <li><b>Enterprise</b> — CI/CD-oriented automated scanning at scale.</li></ul>
  <h4>What you'll do with it</h4>
  <ul><li>Capture and understand traffic (Proxy, HTTP History)</li><li>Manually probe endpoints (Repeater)</li><li>Run controlled, repeated payloads (Intruder)</li><li>Decode/encode and compare (Decoder, Comparer)</li><li>Confirm blind/out-of-band effects (Collaborator)</li></ul>`},
 {id:'f-arch',t:'Burp Architecture',b:'How the proxy, tools, and traffic interconnect',body:()=>`
  <p class="lead">Everything in Burp revolves around a shared HTTP message store fed by the Proxy. Tools pass requests to one another so you can move a single request from capture → manual test → payload testing without retyping.</p>
  ${flow(['Browser / API client','Burp Proxy listener (127.0.0.1:8080)','Interception &amp; match/replace rules','HTTP History + WebSocket History store','Target site map &amp; scope','Send-to → Repeater / Intruder / Scanner','Target application / API'])}
  <h4>Message lifecycle</h4>
  ${flowH(['Request captured','Optionally paused (Intercept)','Recorded in History','Forwarded to server','Response captured','Recorded &amp; linked'])}
  <h4>Why "send to" matters</h4>
  <p>Right-click any request in Proxy/History/Target and route it to the right tool. This preserves headers, cookies, and body exactly — critical for authenticated testing where a single missing token changes the result.</p>`},
 {id:'f-http',t:'HTTP Fundamentals',b:'Methods, status codes, structure of a request/response',body:()=>`
  <p class="lead">You cannot test what you cannot read. Every finding ultimately comes down to a difference in an HTTP message.</p>
  <h4>Anatomy of a request</h4>
  ${httpReq(`POST /api/v1/orders/1001 HTTP/1.1
Host: shop.example.test
Authorization: Bearer <TEST-TOKEN>
Content-Type: application/json
Cookie: session=<TEST-SESSION>

{"qty":1,"couponId":"WELCOME"}`)}
  <div class="kv">
   <div class="k">Request line</div><div class="v">Method + path + version</div>
   <div class="k">Headers</div><div class="v">Metadata: auth, content type, host, cookies</div>
   <div class="k">Body</div><div class="v">Payload for POST/PUT/PATCH</div>
  </div>
  <h4>Methods worth testing</h4>
  <ul><li><b>GET</b> read; <b>POST</b> create/act; <b>PUT/PATCH</b> update; <b>DELETE</b> remove; <b>OPTIONS</b> capabilities/CORS preflight; <b>HEAD</b> headers only.</li>
  <li>Method swapping (GET↔POST, or DELETE on a read endpoint) often reveals missing method-level authorization.</li></ul>
  <h4>Status codes as signals</h4>
  <table class="tbl"><tr><th>Class</th><th>Meaning</th><th>Testing relevance</th></tr>
  <tr><td>2xx</td><td>Success</td><td>Action allowed — check whether it should have been</td></tr>
  <tr><td>3xx</td><td>Redirect</td><td>Open redirect, auth flow, host header effects</td></tr>
  <tr><td>401/403</td><td>Unauth/forbidden</td><td>Access control boundary; compare with 200 for another user</td></tr>
  <tr><td>500</td><td>Server error</td><td>Injection/parse issues; but an error alone is not a vuln</td></tr></table>`},
 {id:'f-tls',t:'HTTPS / TLS',b:'Why Burp needs a CA cert to read encrypted traffic',body:()=>`
  <p class="lead">HTTPS encrypts traffic end-to-end. To read it, Burp performs an authorized man-in-the-middle on your own machine: the browser trusts Burp's CA, Burp decrypts, then re-encrypts to the server.</p>
  <h4>Install Burp's CA certificate</h4>
  <ol><li>With the proxy running, browse to <b>http://burp</b> and download the CA (<span class="muted">cacert.der</span>).</li>
  <li>Import it into the browser/OS trust store as a trusted root.</li>
  <li>Verify HTTPS sites now show in HTTP History without TLS errors.</li></ol>
  <div class="callout crit"><b>Scope discipline:</b> Only ever install and use this to intercept systems you are authorized to test. Remove trust when done on shared machines.</div>
  <h4>Common TLS observations</h4>
  <ul><li>Missing <b>HSTS</b> — downgrade exposure (an indicator, not automatically a finding).</li><li>Weak protocol/cipher config — verify with a TLS scanner, not Burp alone.</li></ul>`},
 {id:'f-reqres',t:'Requests vs Responses',b:'What you control vs what you observe',body:()=>`
  <p class="lead">You control the <b>request</b>. You observe the <b>response</b>. Testing is the disciplined study of how changes to the former alter the latter.</p>
  <div class="grid g2"><div class="card"><h4>You can change</h4><ul><li>Method, path, query/path params</li><li>Headers (Auth, Cookie, Origin, Host, Content-Type)</li><li>Body (JSON/XML/form/multipart/GraphQL)</li></ul></div>
  <div class="card"><h4>You should read</h4><ul><li>Status code &amp; redirects</li><li>Response headers &amp; set-cookie</li><li>Body content &amp; reflections</li><li>Timing &amp; size deltas</li><li>Error detail / stack traces</li></ul></div></div>
  <div class="callout">A single changed byte and a single observed difference is the atom of every web finding. Keep changes isolated so you know what caused what.</div>`},
 {id:'f-headers',t:'Headers',b:'Security-relevant request and response headers',body:()=>`
  <h4>Request headers to watch</h4>
  <table class="tbl"><tr><th>Header</th><th>Why it matters</th></tr>
  <tr><td>Authorization</td><td>Bearer/Basic token — remove or swap to test auth</td></tr>
  <tr><td>Cookie</td><td>Session &amp; auth state — swap between users for IDOR</td></tr>
  <tr><td>Origin / Referer</td><td>CORS &amp; CSRF checks</td></tr>
  <tr><td>Host / X-Forwarded-Host</td><td>Routing, password-reset links, cache keys</td></tr>
  <tr><td>Content-Type</td><td>Parser selection — changing it can bypass weak checks (or be meaningless)</td></tr></table>
  <h4>Response security headers</h4>
  <table class="tbl"><tr><th>Header</th><th>Purpose</th></tr>
  <tr><td>Strict-Transport-Security</td><td>Force HTTPS (HSTS)</td></tr>
  <tr><td>Content-Security-Policy</td><td>Mitigate XSS/data injection</td></tr>
  <tr><td>X-Content-Type-Options</td><td>Prevent MIME sniffing</td></tr>
  <tr><td>X-Frame-Options / frame-ancestors</td><td>Clickjacking defense</td></tr>
  <tr><td>Set-Cookie flags</td><td>HttpOnly, Secure, SameSite</td></tr></table>
  <div class="callout">A missing header is an <b>indicator</b>. Its severity depends on whether the weakness it defends against is actually reachable in this app.</div>`},
 {id:'f-cookies',t:'Cookies',b:'Session cookies, flags, and manipulation',body:()=>`
  <p class="lead">Cookies carry session and auth state. Inspect flags and test whether values can be tampered, replayed, or fixated.</p>
  <ul><li><b>HttpOnly</b> — blocks JS access (XSS token theft mitigation)</li><li><b>Secure</b> — HTTPS-only transmission</li><li><b>SameSite</b> — Lax/Strict/None affects CSRF exposure</li></ul>
  <h4>Tests</h4><ul><li>Remove/alter session cookie → does the server fail closed?</li><li>Reuse an old session after logout (session invalidation)</li><li>Set a session before login and see if it's honored after (fixation)</li></ul>`},
 {id:'f-sessions',t:'Sessions',b:'How server-side state is tracked and where it breaks',body:()=>`
  <p class="lead">A session ties requests to an authenticated identity. Test creation, use, expiry, and invalidation.</p>
  <ul><li><b>Creation</b> — is a new token issued at login? (fixation defense)</li><li><b>Entropy</b> — is the token unpredictable? Use <b>Sequencer</b>.</li><li><b>Expiry</b> — idle/absolute timeout enforced server-side?</li><li><b>Invalidation</b> — does logout/password-change kill existing sessions?</li></ul>`},
 {id:'f-authn',t:'Authentication',b:'Proving who you are — and where it fails',body:()=>`
  <p class="lead">Authentication establishes identity. Testing looks for bypasses, weak handling, and flawed recovery.</p>
  <ul><li>Login, registration, password reset, MFA, account recovery</li><li>Credential handling (transmission, storage hints, error messages)</li><li>Failure handling — lockout, rate limiting, user enumeration</li></ul>
  <p>See the dedicated <a onclick="go('w-authn')">Authentication Testing Workflow</a>.</p>`},
 {id:'f-authz',t:'Authorization',b:'What you are allowed to do — horizontal & vertical',body:()=>`
  <p class="lead">Authorization decides what an authenticated identity may access. The most common serious web findings live here.</p>
  <ul><li><b>Horizontal</b> — access another user's data at the same privilege level (IDOR/BOLA).</li><li><b>Vertical</b> — access higher-privilege functions (privilege escalation, BFLA).</li></ul>
  <p>Best tested with <b>Proxy + Repeater + Comparer</b> using two authorized test accounts. See <a onclick="go('w-idor')">IDOR/BOLA Master Workflow</a>.</p>`},
 {id:'f-rest',t:'REST APIs',b:'Resource-oriented endpoints and how to map them',body:()=>`
  <p class="lead">REST exposes resources via predictable paths and methods. Object identifiers in the path are prime IDOR territory.</p>
  ${httpReq(`GET /api/v1/users/1001/invoices/55 HTTP/1.1
Host: api.example.test
Authorization: Bearer <TEST-TOKEN>`)}
  <ul><li>Enumerate endpoints from HTTP History, Swagger/OpenAPI, JS files.</li><li>Test each method per endpoint; test object IDs across accounts.</li><li>Watch for excessive data exposure in responses.</li></ul>`},
 {id:'f-graphql',t:'GraphQL',b:'Single endpoint, introspection, queries & mutations',body:()=>`
  <p class="lead">GraphQL usually exposes one endpoint (e.g. <span class="muted">/graphql</span>) accepting queries and mutations. Authorization is per-field and often inconsistent.</p>
  <ul><li>Try introspection to map the schema.</li><li>Test field/mutation-level authorization individually.</li><li>Watch nested/aliased queries for DoS and data exposure.</li></ul>
  <p>See <a onclick="go('w-graphql')">GraphQL Testing</a>.</p>`},
 {id:'f-ws',t:'WebSockets',b:'Persistent bidirectional channels',body:()=>`
  <p class="lead">WebSockets keep a long-lived channel open. Burp's WebSocket History lets you observe and replay messages.</p>
  <ul><li>Messages often skip the per-request auth checks HTTP endpoints have.</li><li>Test message-level authorization, input validation, and origin controls.</li></ul>
  <p>See <a onclick="go('w-websocket')">WebSocket Testing</a>.</p>`},
 {id:'f-jwt',t:'JWT',b:'Header.Payload.Signature and what to inspect',body:()=>`
  <p class="lead">A JWT is three base64url parts: header, payload, signature. Decode (never trust) and reason about how the server validates it.</p>
  ${httpReq(`eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9   <- header
.eyJzdWIiOiIxMDAxIiwicm9sZSI6InVzZXIifQ  <- payload
.<signature>`)}
  <ul><li>Inspect <b>alg</b>, <b>exp</b>, <b>iss</b>, <b>aud</b>, <b>sub</b>, role claims.</li><li>Only server-side acceptance of a tampered token proves a flaw.</li></ul>
  <p>See <a onclick="go('w-jwt')">JWT Testing</a>.</p>`},
 {id:'f-oauth',t:'OAuth 2.0',b:'Delegated authorization flows and their pitfalls',body:()=>`
  <p class="lead">OAuth grants third-party access without sharing credentials. Common issues cluster around redirect URIs, state, and token handling.</p>
  <ul><li><b>redirect_uri</b> validation weaknesses → token/code theft.</li><li>Missing/weak <b>state</b> → CSRF in the flow.</li><li>Scope creep, token leakage via referrer/logs.</li></ul>`},
 {id:'f-saml',t:'SAML',b:'XML-based SSO assertions',body:()=>`
  <p class="lead">SAML carries signed XML assertions for SSO. Testing centers on signature validation and assertion tampering.</p>
  <ul><li>Signature wrapping / exclusion — does the SP verify the signature correctly?</li><li>Assertion replay, audience/recipient checks, expiry.</li></ul>`},
 {id:'f-cors',t:'CORS',b:'Cross-origin resource sharing controls',body:()=>`
  <p class="lead">CORS response headers tell the browser which origins may read cross-origin responses. Misconfig can leak authenticated data.</p>
  <ul><li>Reflected <b>Access-Control-Allow-Origin</b> + <b>Allow-Credentials: true</b> is dangerous.</li><li>A permissive header alone isn't exploitable — the endpoint must return sensitive, credentialed data.</li></ul>
  <p>See <a onclick="go('w-cors')">CORS Testing</a> and the vuln card.</p>`}
]; /*END_FOUNDATION*/

/* Burp tools — full template */
function toolFull(o){return `
 <p class="lead">${o.what}</p>
 <h4>Why a VAPT tester uses it</h4><p>${o.why}</p>
 <h4>When to use it</h4><ul>${o.when.map(x=>`<li>${x}</li>`).join('')}</ul>
 <div class="grid g2"><div class="card"><h4>Input</h4><p>${o.input}</p></div><div class="card"><h4>Output to inspect</h4><p>${o.output}</p></div></div>
 <h4>Common workflow</h4>${flow(o.workflow)}
 <h4>Vulnerabilities investigated</h4><div class="chips">${o.vulns.map(v=>`<span class="badge b-tag">${v}</span>`).join('')}</div>
 ${o.inspect?`<h4>HTTP components to inspect</h4><div class="chips">${o.inspect.map(v=>`<span class="badge b-tag">${v}</span>`).join('')}</div>`:''}
 ${o.change?`<h4>What to change</h4><p>${o.change}</p>`:''}
 ${o.observe?`<h4>What to observe</h4><p>${o.observe}</p>`:''}
 <div class="grid g2"><div class="card"><h4>Vulnerable behavior</h4><p>${o.vuln}</p></div><div class="card"><h4>Secure behavior</h4><p>${o.secure}</p></div></div>
 <h4>Validation (real vs false positive)</h4><p>${o.validation}</p>
 <div class="grid g2"><div class="card"><h4>Evidence to capture</h4><p>${o.evidence}</p></div><div class="card"><h4>Reporting</h4><p>${o.reporting}</p></div></div>
 ${o.extra||''}`}

/* Workflows (visual) */
const WORKFLOWS=[
 {id:'w-recon',t:'Reconnaissance',b:'Confirm scope and discover surface',body:()=>`
  ${flow(['Confirm written authorization &amp; scope','Enumerate domains &amp; subdomains','Identify tech stack &amp; entry points','Configure Burp + trust CA','Begin passive mapping'])}
  <div class="callout crit">Never begin without explicit, written authorization and an agreed scope.</div>`},
 {id:'w-mapping',t:'Application Mapping',b:'Build the site map',body:()=>`
  ${flow(['Set scope in Target','Browse every feature manually','Trigger all roles/states','Import OpenAPI where available','Review site map for gaps','Flag high-value functions'])}`},
 {id:'w-attacksurface',t:'Attack Surface Identification',b:'Where to focus',body:()=>`
  <p class="lead">Rank endpoints by trust boundary and sensitivity.</p>
  <ul><li>Anything with an object ID → access-control testing</li><li>Anything server-side-fetching a URL → SSRF</li><li>Anything taking user input into a query/template/command → injection</li><li>Anything changing state → business logic &amp; race conditions</li></ul>`},
 {id:'w-authn',t:'Authentication Testing',b:'Login, reset, MFA, recovery',body:()=>`
  ${flow(['Login','Capture request','Identify auth mechanism','Session/token analysis','Test failure handling (lockout, enumeration)','Test session management','Test password reset','Test MFA','Test account recovery','Test authorization'])}
  <h4>Checklist</h4>${miniChecklist('wauthn',['New session issued on login','Credentials only over HTTPS','No username enumeration via errors/timing','Lockout / rate limiting on login','Session invalidated on logout &amp; password change','Reset token single-use &amp; expiring','MFA cannot be skipped or replayed','Recovery flow can\'t be abused to take over'])}`},
 {id:'w-session',t:'Session Testing',b:'Creation, use, expiry, invalidation',body:()=>`
  ${flow(['Capture pre-auth &amp; post-auth state','Check token issued at login','Sequencer entropy check','Test idle/absolute expiry','Test logout invalidation','Test fixation'])}`},
 {id:'w-authz',t:'Authorization Testing',b:'Horizontal & vertical access',body:()=>`
  ${flow(['Establish two authorized accounts (A, B)','Capture A\'s request to a resource','Replay as B (swap session)','Change object ID to A\'s','Compare responses (Comparer)','Determine authorization outcome','Repeat for vertical (user→admin) functions'])}
  <p>See the dedicated <a onclick="go('w-idor')">IDOR/BOLA Master Workflow</a>.</p>`},
 {id:'w-input',t:'Input Validation',b:'Injection surface testing',body:()=>`
  ${flow(['Identify every input reaching a query/template/command','Establish baseline response','Inject one controlled probe','Observe error/timing/reflection','Confirm in Repeater','Assess real impact'])}`},
 {id:'w-idor',t:'IDOR / BOLA Master Workflow',b:'The canonical access-control test',body:()=>`
  ${flow(['User A (authorized)','Capture request','Identify object identifier','Establish baseline','Authenticate as User B','Replay request','Change identifier to A\'s object','Compare response','Determine authorization','Validate access','Document evidence'])}
  <h4>Identifier types to test</h4><div class="chips">${['Numeric IDs','UUIDs','Account IDs','Order IDs','Document IDs','File IDs','API resource IDs'].map(x=>`<span class="badge b-tag">${x}</span>`).join('')}</div>
  <div class="grid g2"><div class="card"><h4>Horizontal</h4><p>Same privilege level — can User B read/modify User A's objects?</p></div>
  <div class="card"><h4>Vertical</h4><p>Different privilege level — can a normal user reach admin functions/objects?</p></div></div>
  <div class="callout">UUIDs reduce guessability but do <b>not</b> provide authorization. If you can obtain another user's UUID (from responses, referrers, logs) and the server serves it, it's still IDOR.</div>`},
 {id:'w-api',t:'API VAPT Workflow',b:'REST, GraphQL, WebSocket',body:()=>`
  ${flow(['Swagger / OpenAPI','Identify endpoints','Configure Burp','Capture requests','Build endpoint inventory','Authentication testing','Authorization testing','Parameter testing','Input validation','Rate limiting','Mass assignment','Data exposure','Business logic','GraphQL / WebSocket','Evidence','Reporting'])}
  <div class="grid g3"><div class="card"><h4>REST</h4><p>Object IDs in path → BOLA. Methods per endpoint → BFLA. Response fields → excessive exposure.</p></div>
  <div class="card"><h4>GraphQL</h4><p>Introspection, per-field authz, query depth/batching. See <a onclick="go('w-graphql')">GraphQL</a>.</p></div>
  <div class="card"><h4>WebSocket</h4><p>Message-level authz, input validation, origin. See <a onclick="go('w-websocket')">WebSocket</a>.</p></div></div>`},
 {id:'w-jwt',t:'JWT Testing',b:'Inspect claims and validation',body:()=>`
  <p class="lead">Decode → reason → test how the server validates.</p>
  ${flow(['Capture token','Decode header &amp; payload (Decoder)','Inspect alg, exp, iss, aud, sub, role','Attempt controlled modification (test env)','Resend','Observe server acceptance','Only server acceptance = finding'])}
  <div class="callout">Token manipulation is not automatically exploitable. A tampered token is only a finding if the server <b>accepts</b> it. Always confirm server-side.</div>`},
 {id:'w-oauth',t:'OAuth 2.0 Testing',b:'Flow and redirect handling',body:()=>`
  ${flow(['Map the OAuth flow','Inspect redirect_uri validation','Test state parameter (CSRF)','Check token leakage (referrer, logs)','Assess scope handling'])}`},
 {id:'w-cors',t:'CORS Testing',b:'Cross-origin data exposure',body:()=>`
  ${flow(['Identify credentialed, sensitive endpoints','Send request with a foreign Origin','Inspect Access-Control-Allow-Origin/-Credentials','Test whether arbitrary origins are reflected','Confirm a real cross-origin read is possible'])}
  <div class="callout">A permissive CORS header is unsafe <i>config</i>. It's only a real finding when a malicious origin can actually read sensitive, credentialed data.</div>`},
 {id:'w-ssrf',t:'SSRF Testing',b:'Server-side request forgery',body:()=>`
  <h4>Discovery — look for</h4><div class="chips">${['URL parameters','Webhooks','Import URLs','Image URLs','PDF generators','URL previews','Callback URLs','External integrations'].map(x=>`<span class="badge b-tag">${x}</span>`).join('')}</div>
  ${flow(['Baseline with a benign external URL','Substitute Collaborator URL','Observe response &amp; out-of-band callback','Determine reachability (internal ranges/metadata)','Determine impact','Document'])}
  <div class="callout crit">Test only authorized targets. Do not pivot into third-party or production infrastructure. A callback proves SSRF exists; impact needs careful, in-scope validation.</div>`},
 {id:'w-fileupload',t:'File Upload Testing',b:'Validation and execution',body:()=>`
  ${flow(['Upload a benign baseline file','Vary Content-Type','Vary extension &amp; double extensions','Test filename handling / path traversal','Locate stored file &amp; access it','Determine if it executes or is served unsafely'])}
  <div class="callout">Changing only the Content-Type header proves nothing by itself. A finding requires demonstrating unsafe storage, execution, or retrieval.</div>`},
 {id:'w-bizlogic',t:'Business Logic Testing',b:'Abuse of intended functionality',body:()=>`
  <p class="lead">Ask what the app assumes about how it's used, then break the assumption. Repeater + Comparer are your tools.</p>
  <ul><li>Can a step be skipped?</li><li>Can requests be reordered?</li><li>Can a request be replayed?</li><li>Can values be modified (price, qty, negative numbers)?</li><li>Can another user's object be supplied?</li><li>Can state transitions be bypassed?</li><li>Can an expired action be reused?</li></ul>`},
 {id:'w-clientside',t:'Client-Side Testing',b:'XSS, DOM, CORS, redirects',body:()=>`
  ${flow(['Map all reflected/stored inputs','Identify sink context (HTML/JS/attr/URL)','Inject context-appropriate probe','Confirm execution or DOM sink','Assess impact (session, actions)'])}`},
 {id:'w-secheaders',t:'Security Headers',b:'Defense-in-depth verification',body:()=>`
  ${flow(['Capture representative responses','Check HSTS, CSP, X-Content-Type-Options, frame controls','Check Set-Cookie flags','Map each gap to a reachable weakness','Rate severity by real exposure'])}`},
 {id:'w-config',t:'Configuration Testing',b:'Misconfig and exposure',body:()=>`
  <ul><li>Allowed HTTP methods (TRACE/PUT/DELETE)</li><li>Verbose errors / stack traces</li><li>Debug endpoints, directory listing</li><li>Default creds / exposed admin panels</li></ul>`},
 {id:'w-errors',t:'Error Handling',b:'What errors reveal',body:()=>`
  <p>Trigger errors deliberately and read them: stack traces, DB errors, internal paths, framework versions. Each is an <b>indicator</b> of information disclosure whose severity depends on what's revealed.</p>`},
 {id:'w-infodisc',t:'Information Disclosure',b:'Leaked data and metadata',body:()=>`
  <ul><li>Comments, source maps, backup files (.bak, ~)</li><li>Verbose errors, debug output</li><li>Sensitive data in API responses (excessive exposure)</li><li>Tokens/keys in JS or history</li></ul>`},
 {id:'w-race',t:'Race Conditions',b:'Concurrency abuse',body:()=>`
  ${flow(['Identify a state-changing, limited action','Establish baseline single-request behavior','Send many concurrent requests (single-packet where possible)','Compare outcomes to the limit','Confirm business impact (e.g. double-spend)'])}
  <div class="callout">Burp can issue tightly-timed concurrent requests. A race is only a finding when concurrency produces a security/business impact the sequential flow prevents.</div>`},
 {id:'w-websocket',t:'WebSocket Testing',b:'Message-level testing',body:()=>`
  ${flow(['Connect','Observe messages','Identify message structure','Modify message','Replay','Test authorization','Test input validation','Test origin controls','Test business logic'])}
  <h4>Common targets</h4><div class="chips">${['Chat','Notifications','Trading','Real-time dashboards','Collaboration'].map(x=>`<span class="badge b-tag">${x}</span>`).join('')}</div>`},
 {id:'w-graphql',t:'GraphQL Testing',b:'Introspection and per-field authz',body:()=>`
  ${flow(['Send introspection query','Map types, queries, mutations','Test each mutation\'s authorization','Test field-level authorization','Probe nested/aliased queries (depth/DoS)','Test batching','Read error verbosity'])}
  <div class="callout">The single endpoint hides many operations. Authorization must be checked <b>per field/operation</b>, not just at the endpoint.</div>`}
]; /*END_WORKFLOWS*/

/* Vulnerabilities — full 18-point template */
function vulnFull(o){return `
 <div class="tag-row">${sevBadge(o.sevHint||'info')} <span class="badge b-tag">${o.owasp}</span> <span class="badge b-tag">${o.cwe}</span> ${o.tools.map(toolBadge).join(' ')}</div>
 <h4>1. Definition</h4><p>${o.def}</p>
 <h4>2. Why it matters</h4><p>${o.matters}</p>
 <h4>3. Where to look</h4><p>${o.where}</p>
 <h4>4. Burp tool</h4><p>${o.tool}</p>
 <h4>5. Starting request</h4>${o.start?httpReq(o.start):`<p>${o.startText||''}</p>`}
 <h4>6. Establish baseline</h4><p>${o.baseline}</p>
 <h4>7. Testing approach</h4>${Array.isArray(o.approach)?flow(o.approach):`<p>${o.approach}</p>`}
 <h4>8. What to modify</h4><p>${o.modify}</p>
 <div class="grid g2"><div class="card"><h4>9. Vulnerable behavior</h4><p>${o.vuln}</p></div><div class="card"><h4>10. Secure behavior</h4><p>${o.secure}</p></div></div>
 <h4>11. Validation</h4><p>${o.validation}</p>
 <h4>12. Common false positives</h4><ul>${o.fp.map(x=>`<li>${x}</li>`).join('')}</ul>
 <h4>13. Impact</h4><p>${o.impact}</p>
 <h4>14. Evidence</h4><p>${o.evidence}</p>
 <h4>15. CWE</h4><p>${o.cweNote}</p>
 <h4>16. OWASP</h4><p>${o.owaspNote}</p>
 <h4>17. CVSS considerations</h4><p class="muted">Do not assign a score from the name. Reason through each metric for the verified scenario:</p>
  <div class="kv"><div class="k">Attack Vector</div><div class="v">${o.cvss.av}</div><div class="k">Attack Complexity</div><div class="v">${o.cvss.ac}</div><div class="k">Privileges Required</div><div class="v">${o.cvss.pr}</div><div class="k">User Interaction</div><div class="v">${o.cvss.ui}</div><div class="k">Scope</div><div class="v">${o.cvss.s}</div><div class="k">C / I / A</div><div class="v">${o.cvss.cia}</div></div>
 <h4>18. Remediation</h4><p>${o.remediation}</p>`}

 return `<table class="tbl"><tr><th>Vulnerability</th><th>OWASP</th><th>CWE</th><th>Burp tools</th><th>Where to test</th><th>What to change</th><th>Vulnerable indicator</th><th>Sev*</th></tr>
 ${rows.map(v=>`<tr style="cursor:pointer" onclick="go('${v.id}')"><td><b>${v.t}</b></td><td>${v.owasp}</td><td>${v.cwe}</td><td>${v.tools.map(toolBadge).join(' ')}</td><td>${v.matrix.where}</td><td>${v.matrix.change}</td><td>${v.matrix.ind}</td><td>${sevBadge(v.sevHint)}</td></tr>`).join('')}</table>
 <p class="muted">* Indicative only. Severity depends on the verified scenario and context — never assign from the name.</p>`;
}
function falseposPage(){
 const items=[['Different status code','A 302/403/500 can arise from many benign causes; needs a security-relevant explanation.'],['Different response size','Length changes with content, not necessarily with a vulnerability.'],['Error message','An error indicates unexpected input handling, not automatically injection.'],['Reflected input','Reflection is only XSS if it executes in a code context.'],['CORS header present','Permissive config ≠ exploitable data theft.'],['Missing security header','An indicator; severity depends on a reachable weakness it would have mitigated.'],['Scanner alert','A lead requiring manual reproduction.'],['Timing difference','Network jitter mimics time-based oracles; needs repeatable, controlled deltas.'],['Different content for two users','May be legitimate personalization, not IDOR.']];

function cwePage(){

  <div class="card"><h4>CWE validation checklist</h4>${miniChecklist('cwe',['Does the CWE describe the weakness (root cause), not the impact?','Is it specific rather than a too-generic parent (e.g. avoid bare CWE-20 when CWE-89 fits)?','Is it the current, non-deprecated ID?','Does the mapping match what you actually demonstrated?','Would another tester agree the CWE fits the evidence?'])}</div>
  <div class="grid g2"><div class="card"><h4>Common mistakes</h4><ul><li>Using CWE-20 (Improper Input Validation) for everything</li><li>Choosing a CWE that describes impact (e.g. data exposure) instead of cause (e.g. missing authz)</li><li>Citing a deprecated CWE</li><li>Over-broad parent when a precise child exists</li></ul></div>

function reqBuilderPage(){
 return `<p class="lead">An educational inspector. Fill a request, then generate a "what should I inspect?" review. It does not send anything.</p>
  <div class="card reqbuilder">
   <div class="row"><label class="muted">Method</label><select class="fld" id="rb-m"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>OPTIONS</option><option>HEAD</option></select></div>
   <div class="row"><label class="muted">Host</label><input class="fld" id="rb-h" value="api.example.test"></div>
   <div class="row"><label class="muted">Path</label><input class="fld" id="rb-p" value="/api/v1/users/1001"></div>
   <div class="row"><label class="muted">Auth header</label><input class="fld" id="rb-a" value="Bearer <TEST-TOKEN>"></div>
   <div class="row"><label class="muted">Cookie</label><input class="fld" id="rb-c" value="session=<TEST-SESSION>"></div>
   <div class="row"><label class="muted">Content-Type</label><input class="fld" id="rb-ct" value="application/json"></div>
   <div class="row"><label class="muted">Body</label><textarea id="rb-b">{"userId":"1001"}</textarea></div>
   <button class="btn" onclick="buildReq()">Inspect this request</button>
  </div>
  <div id="rb-out"></div>`;
}
function initReqBuilder(){buildReq()}
function buildReq(){
 const m=val('rb-m'),h=val('rb-h'),p=val('rb-p'),a=val('rb-a'),c=val('rb-c'),ct=val('rb-ct'),b=val('rb-b');
 const raw=`${m} ${p} HTTP/1.1\nHost: ${h}\n${a?'Authorization: '+a+'\n':''}${c?'Cookie: '+c+'\n':''}${['POST','PUT','PATCH'].includes(m)?'Content-Type: '+ct+'\n':''}\n${['POST','PUT','PATCH'].includes(m)?b:''}`;
 const hasId=/\/(\d{2,}|[0-9a-f-]{8,})(\/|$)/i.test(p)||/id/i.test(b);
 const tips=[];
 if(hasId)tips.push('<b>Object ID present</b> → test IDOR/BOLA: swap the identifier and/or the auth identity and compare (Repeater + Comparer).');
 if(a)tips.push('<b>Authorization header</b> → remove it, corrupt it, or swap to another user to test authentication &amp; authorization.');
 if(/graphql/i.test(p))tips.push('<b>GraphQL endpoint</b> → try introspection and per-field authorization.');
 if(m==='GET'&&hasId)tips.push('Try method swap (GET→POST/PUT/DELETE) to probe method-level authorization.');
 if(ct&&['POST','PUT','PATCH'].includes(m))tips.push('<b>Body parser</b> → test injection appropriate to '+ct+', and mass assignment (add unexpected fields like isAdmin).');
 if(/url|link|callback|webhook|import|image/i.test(b))tips.push('<b>URL-like value</b> → SSRF candidate (Repeater + Collaborator).');
 tips.push('Check the <b>response</b>: status, Set-Cookie, security headers, reflected input, timing, and any excessive data returned.');
 const el=document.getElementById('rb-out');
 el.innerHTML=`<h3>Request</h3>${httpReq(raw)}<h3>What should I inspect?</h3><div class="card"><ul>${tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
}
function val(id){const e=document.getElementById(id);return e?e.value:''}
const VSTEPS=['Can I reproduce it?','Can I explain why it is security relevant?','Can I demonstrate unauthorized behavior?','Can I determine impact?','Can another tester reproduce it?','Is the affected endpoint in scope?','Is there a legitimate business explanation?','Can I map it to a reasonable CWE?','Can I justify severity?','Can I provide remediation?'];
function validationPage(){
 return `<p class="lead">Answer each step. Do not classify a finding without working through them.</p>
  <div class="card">${VSTEPS.map((s,i)=>`<div class="chk" id="vc-${i}"><input type="checkbox" onchange="vsync()"><label><b>Step ${i+1}.</b> ${s}</label></div>`).join('')}</div>
  <div id="vres"></div>`;
}
function initValidation(){vsync()}
function vsync(){
 const boxes=VSTEPS.map((_,i)=>document.querySelector('#vc-'+i+' input').checked);
 const n=boxes.filter(Boolean).length;
 const inScope=boxes[5],hasBiz=boxes[6];
 let verdict,cls;
 if(hasBiz&&n<9){verdict='⚠ Possible FALSE POSITIVE — a legitimate business explanation may exist. Investigate before reporting.';cls='';}
 else if(!inScope&&n>0){verdict='⛔ OUT OF SCOPE — do not proceed until scope is confirmed.';cls='crit';}
 else if(n>=9){verdict='✅ CONFIRMED FINDING — reproducible, impactful, mapped, and remediable.';cls='ok';}
 else if(n>=5){verdict='🔎 NEEDS VALIDATION — promising, but not yet demonstrable end-to-end.';cls='';}
 else{verdict='• POTENTIAL FINDING — early indicator only.';cls='';}
 document.getElementById('vres').innerHTML=`<div class="callout ${cls}"><b>${n}/10 satisfied.</b><br>${verdict}</div>`;
}
function lookatPage(){
 const block=(title,items)=>`<div class="card"><h4>${title}</h4><div class="chips">${items.map(i=>`<span class="badge b-tag">${i}</span>`).join('')}</div></div>`;
 return `<p class="lead">A reusable checklist for mentally inspecting any HTTP request/response.</p>
  <div class="grid g2">
  ${block('METHOD',['GET','POST','PUT','PATCH','DELETE','OPTIONS','HEAD'])}
  ${block('URL',['Path','Parameters','File names','IDs'])}
  ${block('HEADERS',['Authorization','Cookie','Origin','Referer','Host','Content-Type','Accept','User-Agent','Forwarded headers'])}

  </div>
  ${block('RESPONSE',['Status code','Headers','Cookies','Body','Errors','Timing','Redirects','Reflections'])}`;
}

 const g=id=>esc(val(id)||'—').replace(/\n/g,'<br>');
 const out=`<div class="card"><h2 class="pt" style="font-size:22px">${g('rp-title')}</h2>
  <div class="tag-row">${sevBadge(({Critical:'crit',High:'high',Medium:'med',Low:'low',Informational:'info'})[val('rp-sev')]||'info')} <span class="badge b-tag">${g('rp-cwe')}</span> <span class="badge b-tag">${g('rp-owasp')}</span></div>

/* ============ SEARCH ============ */
const SEARCHIDX=(()=>{const idx=[];
 FOUNDATION.forEach(x=>idx.push({id:x.id,cat:'Foundation',nm:x.t,ds:x.b,tools:''}));
 TOOLS.forEach(x=>idx.push({id:x.id,cat:'Burp Tool',nm:x.t,ds:x.b,tools:''}));
 WORKFLOWS.forEach(x=>idx.push({id:x.id,cat:'Workflow',nm:x.t,ds:x.b,tools:''}));
 VULNS.forEach(x=>idx.push({id:x.id,cat:'Vulnerability',nm:x.t,ds:x.owasp+' · '+x.cwe,tools:x.tools.join(', ')}));
 LABS.forEach(x=>idx.push({id:x.id,cat:'Lab',nm:x.t,ds:x.diff,tools:''}));
 [['matrix','Vulnerability Master Matrix'],['owaspmatrix','OWASP Testing Matrix'],['cwe','CWE Mapping'],['cvss','CVSS Guidance'],['decision','Which Burp Tool?'],['reqbuilder','Request Inspector'],['validation','Finding Validation Engine'],['report','VAPT Report Builder'],['checklist','Master VAPT Checklist'],['cheat','Burp Cheat Sheet'],['paths','Learning Paths'],['lookat','What Should I Look At?'],['falsepos','False Positive Training'],['mindset','Master Burp Mindset'],['masterflow','Master Workflow'],['coremodel','Baseline→Modify→Compare→Validate']].forEach(p=>idx.push({id:p[0],cat:'Reference',nm:p[1],ds:'',tools:''}));
 return idx})();
function doSearch(q){const box=document.getElementById('sres');q=q.trim().toLowerCase();if(!q){box.classList.remove('show');return}
 const res=SEARCHIDX.filter(x=>(x.nm+' '+x.ds+' '+x.cat+' '+x.tools).toLowerCase().includes(q)).slice(0,12);
 if(!res.length){box.innerHTML='<div class="sres"><div class="ds">No matches.</div></div>';box.classList.add('show');return}
 box.innerHTML=res.map(r=>`<div class="sres" onclick="go('${r.id}');document.getElementById('sres').classList.remove('show');document.getElementById('q').value=''"><div class="cat">${r.cat}${r.tools?' · '+r.tools:''}</div><div class="nm">${r.nm}</div>${r.ds?`<div class="ds">${r.ds}</div>`:''}</div>`).join('');
 box.classList.add('show');
}

document.getElementById('q').addEventListener('blur',()=>setTimeout(()=>document.getElementById('sres').classList.remove('show'),200));

renderNav();go('dashboard');
